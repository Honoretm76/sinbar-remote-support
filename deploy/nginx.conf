limit_req_zone $binary_remote_addr zone=support_session_create:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=support_session_consume:10m rate=30r/m;

server_tokens off;

# Rendered by sinbar-support-deploy from an exact Cloudflared container address
# (normally a /32). CF-Connecting-IP is ignored from every other source, so an
# Internet client cannot spoof the address used for rate limiting.
set_real_ip_from __CLOUDFLARED_PROXY_CIDR__;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; media-src 'none'; font-src 'none'; worker-src 'none'; manifest-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Nginx 1.29.3+ keeps the security headers above when an exact location
    # adds its own cache or download header.
    add_header_inherit merge;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /assets/styles.css {
        try_files $uri =404;
        default_type text/css;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /assets/app.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /assets/sinbar-primary-logo.jpg {
        try_files $uri =404;
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /download/manifest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /download/SHA256SUMS.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /download/v2.0.0/windows/Sinbar-Support-Assistant-Setup.exe {
        try_files $uri =404;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="Sinbar-Support-Assistant-Setup.exe"' always;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /download/v2.0.0/macos/Sinbar-Support-Assistant.pkg {
        try_files $uri =404;
        default_type application/vnd.apple.installer+xml;
        add_header Content-Disposition 'attachment; filename="Sinbar-Support-Assistant.pkg"' always;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location ~ ^/download/vendor/rustdesk/1[.]4[.]9/(windows|macos)/rustdesk-1[.]4[.]9-(x86_64|aarch64)[.](msi|dmg)$ {
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/v1/support/sessions {
        # Request bodies and bearer-token responses never enter access logs.
        access_log off;
        limit_except POST { deny all; }
        limit_req zone=support_session_create burst=3 nodelay;
        client_max_body_size 4k;

        proxy_pass http://support-session-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location = /api/v1/support/sessions/consume {
        # The one-use bearer token is in the JSON body. Keep this route out of
        # access logs at both Nginx and Gunicorn.
        access_log off;
        limit_except POST { deny all; }
        limit_req zone=support_session_consume burst=5 nodelay;
        client_max_body_size 4k;

        proxy_pass http://support-session-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
