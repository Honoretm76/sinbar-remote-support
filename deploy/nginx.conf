server_tokens off;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; media-src 'none'; font-src 'none'; worker-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header_inherit merge;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /assets/styles.css {
        try_files $uri =404;
        default_type text/css;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /assets/app.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /assets/sinbar-primary-logo.jpg {
        try_files $uri =404;
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /download/manifest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /download/SHA256SUMS.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /download/windows/x64 {
        alias /usr/share/nginx/html/download/vendor/rustdesk/1.4.9/windows/rustdesk-1.4.9-x86_64.exe;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="Sinbar-Remote-Support-qs--QfiIiOikXYsVmciwiIiojIpBXYiwiI0VmbuMHduFGdsV3cu92YyFmYul2cuUGdv1WZyJiOiQ3cvhmIsISPrF2ZmNWZZ92TZd1dhJke4ckYm9mcLh1SpdEeK5kUtRWdOFlMJJHe4AHUyJiOikXZrJye.exe"' always;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /download/windows/arm64 {
        alias /usr/share/nginx/html/download/vendor/rustdesk/1.4.9/windows/rustdesk-1.4.9-aarch64.exe;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="Sinbar-Remote-Support-ARM64-qs--QfiIiOikXYsVmciwiIiojIpBXYiwiI0VmbuMHduFGdsV3cu92YyFmYul2cuUGdv1WZyJiOiQ3cvhmIsISPrF2ZmNWZZ92TZd1dhJke4ckYm9mcLh1SpdEeK5kUtRWdOFlMJJHe4AHUyJiOikXZrJye.exe"' always;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /download/macos/apple-silicon {
        alias /usr/share/nginx/html/download/vendor/rustdesk/1.4.9/macos/rustdesk-1.4.9-aarch64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition 'attachment; filename="Sinbar-Remote-Support-macOS-Apple-Silicon.dmg"' always;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /download/macos/intel {
        alias /usr/share/nginx/html/download/vendor/rustdesk/1.4.9/macos/rustdesk-1.4.9-x86_64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition 'attachment; filename="Sinbar-Remote-Support-macOS-Intel.dmg"' always;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location ~ ^/download/vendor/rustdesk/1[.]4[.]9/(windows|macos)/rustdesk-1[.]4[.]9-(x86_64|aarch64)[.](exe|dmg)$ {
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
