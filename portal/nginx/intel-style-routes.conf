# Replace the existing portal location rules with this snippet inside the
# support portal `server` block. Do not include it beside another `location /`.
# This snippet assumes:
#   root /usr/share/nginx/html;
# and a session API service reachable as support-session-api:8080.

add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; media-src 'none'; font-src 'none'; worker-src 'none'; manifest-src 'self'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location = / {
    try_files /index.html =404;
    expires -1;
}

location = /index.html {
    try_files $uri =404;
    expires -1;
}

location = /assets/styles.css {
    try_files $uri =404;
    default_type text/css;
    expires 5m;
}

location = /assets/app.js {
    try_files $uri =404;
    default_type application/javascript;
    expires 5m;
}

location = /assets/sinbar-primary-logo.jpg {
    try_files $uri =404;
    default_type image/jpeg;
    expires 1h;
}

location = /download/manifest.json {
    try_files $uri =404;
    default_type application/json;
    expires -1;
}

location = /download/v2.0.0/windows/Sinbar-Support-Assistant-Setup.exe {
    try_files $uri =404;
    default_type application/vnd.microsoft.portable-executable;
    expires -1;
}

location = /download/v2.0.0/macos/Sinbar-Support-Assistant.pkg {
    try_files $uri =404;
    default_type application/vnd.apple.installer+xml;
    expires -1;
}

location = /api/v1/support/sessions {
    access_log off;
    limit_except POST {
        deny all;
    }

    client_max_body_size 2k;
    proxy_pass http://support-session-api:8080/api/v1/support/sessions;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, rather than append to, any client-supplied forwarding chain.
    # The API may trust this portal proxy, so preserving an untrusted first hop
    # would let a caller rotate its application rate-limit identity.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; media-src 'none'; font-src 'none'; worker-src 'none'; manifest-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

location = /api/v1/support/sessions/consume {
    access_log off;
    limit_except POST {
        deny all;
    }

    client_max_body_size 2k;
    proxy_pass http://support-session-api:8080/api/v1/support/sessions/consume;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

# Preserve this final deny route after all exact portal locations.
location / {
    return 404;
}
