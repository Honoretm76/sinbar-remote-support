name: Sinbar Support verified portable release

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'deploy/nginx.conf'
      - '.github/workflows/sinbar-support-release.yml'
  push:
    branches:
      - main
    paths:
      - 'portal/**'
      - 'deploy/nginx.conf'
      - '.github/workflows/sinbar-support-release.yml'
  workflow_dispatch:

concurrency:
  group: sinbar-support-vendor-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTDESK_VERSION: '1.4.9'
  RUSTDESK_RELEASE_BASE: 'https://github.com/rustdesk/rustdesk/releases/download/1.4.9'
  RUSTDESK_WINDOWS_X86_64_SHA256: 'eaedeb0088e687bf46f7c46a9c6ea5493ce51f3134dfd6acbedb47b5b9136274'
  RUSTDESK_WINDOWS_ARM64_SHA256: 'c717bf52fdd601c58419e46c503176dd87187d174ebf8b3b5854ca381e8e9145'
  RUSTDESK_MACOS_X86_64_SHA256: 'fa1129a0635019f9c5841937942cc2b08be028a192f47c009edde7e53812904e'
  RUSTDESK_MACOS_ARM64_SHA256: 'f7935597b247d42c8f2a2ed71176a9f5868018cd9e1a33b8096418a668c8caf0'
  RUSTDESK_WINDOWS_PUBLISHER_SPKI_SHA256: '85a1152301ba31d625ce06294584deaee9cf32c2dd7bdfdf72821499cd745116'

jobs:
  validate-contract:
    name: Validate direct-vendor release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate portal, deployment, and locked vendor contract
        shell: bash
        run: |
          set -euo pipefail
          python3 portal/tests/validate_portal.py
          python3 -m json.tool portal/download/manifest.json >/dev/null

  verify-windows-vendor:
    name: Verify RustDesk Windows vendor signatures
    needs: validate-contract
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Download exact portable executables and verify SHA-256, Authenticode, publisher, and SPKI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $output = Join-Path $env:RUNNER_TEMP 'verified-windows'
          New-Item -ItemType Directory -Path $output | Out-Null

          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw 'signtool.exe was not found on the GitHub-hosted runner.'
          }

          $assets = @(
            [ordered]@{
              architecture = 'x86_64'
              name = 'rustdesk-1.4.9-x86_64.exe'
              bytes = 24472432
              sha256 = $env:RUSTDESK_WINDOWS_X86_64_SHA256
            },
            [ordered]@{
              architecture = 'arm64'
              name = 'rustdesk-1.4.9-aarch64.exe'
              bytes = 22318960
              sha256 = $env:RUSTDESK_WINDOWS_ARM64_SHA256
            }
          )

          $rows = @(
            foreach ($asset in $assets) {
              $path = Join-Path $output $asset.name
              $url = "$env:RUSTDESK_RELEASE_BASE/$($asset.name)"
              Invoke-WebRequest -Uri $url -OutFile $path -MaximumRedirection 5

              if ((Get-Item -LiteralPath $path).Length -ne $asset.bytes) {
                throw "Unexpected byte count for $($asset.name)."
              }
              $digest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -cne $asset.sha256) {
                throw "SHA-256 mismatch for $($asset.name)."
              }

              & $signTool.FullName verify /pa /all /v $path
              if ($LASTEXITCODE -ne 0) {
                throw "SignTool policy verification failed for $($asset.name)."
              }

              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
                  $null -eq $signature.SignerCertificate) {
                throw "Authenticode validation failed for $($asset.name): $($signature.Status)."
              }
              $subject = $signature.SignerCertificate.Subject
              if ($subject.IndexOf('PURSLANE', [StringComparison]::OrdinalIgnoreCase) -lt 0) {
                throw "Unexpected RustDesk publisher for $($asset.name): $subject"
              }

              [byte[]]$spki = $signature.SignerCertificate.PublicKey.ExportSubjectPublicKeyInfo()
              [byte[]]$spkiDigest = [Security.Cryptography.SHA256]::HashData($spki)
              $pin = [Convert]::ToHexString($spkiDigest).ToLowerInvariant()
              if ($pin -cne $env:RUSTDESK_WINDOWS_PUBLISHER_SPKI_SHA256) {
                throw "Publisher SPKI pin mismatch for $($asset.name)."
              }

              [pscustomobject][ordered]@{
                architecture = $asset.architecture
                name = $asset.name
                bytes = $asset.bytes
                sha256 = $digest
                authenticodeStatus = 'Valid'
                publisherSubject = $subject
                publisherSpkiSha256 = $pin
                signtoolPolicyVerified = $true
              }
            }
          )

          if (($rows.publisherSpkiSha256 | Select-Object -Unique).Count -ne 1) {
            throw 'The two Windows packages do not use the same publisher key.'
          }
          $receipt = [ordered]@{
            schemaVersion = 1
            vendor = 'RustDesk'
            vendorVersion = $env:RUSTDESK_VERSION
            verifiedAt = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            assets = $rows
          }
          [IO.File]::WriteAllText(
            (Join-Path $output 'windows-vendor-verification.json'),
            (($receipt | ConvertTo-Json -Depth 8) + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload unchanged verified Windows assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-windows
          path: |
            ${{ runner.temp }}/verified-windows/rustdesk-1.4.9-x86_64.exe
            ${{ runner.temp }}/verified-windows/rustdesk-1.4.9-aarch64.exe
            ${{ runner.temp }}/verified-windows/windows-vendor-verification.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify-macos-vendor:
    name: Verify RustDesk macOS vendor signatures
    needs: validate-contract
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Download exact DMGs and verify SHA-256, Gatekeeper, bundle ID, and common Team ID
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/verified-macos"
          rows="$RUNNER_TEMP/macos-verification.tsv"
          mkdir -p "$output"
          : > "$rows"
          current_mount=''
          cleanup() {
            if [[ -n "$current_mount" ]]; then
              hdiutil detach "$current_mount" -force >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          while IFS='|' read -r architecture name expected_bytes expected_hash; do
            path="$output/$name"
            curl --fail --location --proto '=https' --tlsv1.2 \
              --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              --output "$path" "$RUSTDESK_RELEASE_BASE/$name"
            actual_bytes=$(stat -f '%z' "$path")
            actual_hash=$(shasum -a 256 "$path" | awk '{print $1}')
            [[ "$actual_bytes" == "$expected_bytes" ]] || { echo "ERROR: byte count mismatch for $name" >&2; exit 1; }
            [[ "$actual_hash" == "$expected_hash" ]] || { echo "ERROR: SHA-256 mismatch for $name" >&2; exit 1; }

            current_mount="$RUNNER_TEMP/mount-$architecture"
            mkdir -p "$current_mount"
            hdiutil attach -readonly -nobrowse -mountpoint "$current_mount" "$path" >/dev/null
            app="$current_mount/RustDesk.app"
            [[ -d "$app" && ! -L "$app" ]] || { echo "ERROR: RustDesk.app missing from $name" >&2; exit 1; }
            hdiutil verify "$path"
            xcrun stapler validate "$path"
            codesign --verify --deep --strict --all-architectures --verbose=4 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            details=$(codesign -dv --verbose=4 "$app" 2>&1)
            identifier=$(sed -n 's/^Identifier=//p' <<<"$details" | head -n1)
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
            [[ "$version" == '1.4.9' ]] || { echo "ERROR: app version mismatch for $name" >&2; exit 1; }
            team_id=$(sed -n 's/^TeamIdentifier=//p' <<<"$details" | head -n1)
            [[ "$identifier" == 'com.carriez.rustdesk' ]] || { echo "ERROR: bundle identifier mismatch for $name" >&2; exit 1; }
            [[ "$team_id" =~ ^[A-Z0-9]{10}$ ]] || { echo "ERROR: invalid Team ID for $name" >&2; exit 1; }
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$architecture" "$name" "$actual_bytes" "$actual_hash" "$identifier" "$team_id" >> "$rows"
            hdiutil detach "$current_mount" >/dev/null
            current_mount=''
          done <<EOF
          x86_64|rustdesk-1.4.9-x86_64.dmg|32503998|$RUSTDESK_MACOS_X86_64_SHA256
          arm64|rustdesk-1.4.9-aarch64.dmg|25906851|$RUSTDESK_MACOS_ARM64_SHA256
          EOF

          ROWS="$rows" OUTPUT="$output/macos-vendor-verification.json" \
          RUSTDESK_VERSION="$RUSTDESK_VERSION" python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          assets = []
          for line in Path(os.environ['ROWS']).read_text(encoding='utf-8').splitlines():
              architecture, name, size, digest, bundle_id, team_id = line.split('\t')
              assets.append({
                  'architecture': architecture,
                  'name': name,
                  'bytes': int(size),
                  'sha256': digest,
                  'bundleIdentifier': bundle_id,
                  'teamIdentifier': team_id,
                  'codesignVerified': True,
                  'gatekeeperAccepted': True,
              })
          if len(assets) != 2 or len({row['teamIdentifier'] for row in assets}) != 1:
              raise SystemExit('ERROR: both macOS packages must use one common Team ID')
          receipt = {
              'schemaVersion': 1,
              'vendor': 'RustDesk',
              'vendorVersion': os.environ['RUSTDESK_VERSION'],
              'verifiedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'assets': assets,
          }
          Path(os.environ['OUTPUT']).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload unchanged verified macOS assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-macos
          path: |
            ${{ runner.temp }}/verified-macos/rustdesk-1.4.9-x86_64.dmg
            ${{ runner.temp }}/verified-macos/rustdesk-1.4.9-aarch64.dmg
            ${{ runner.temp }}/verified-macos/macos-vendor-verification.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

